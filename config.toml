# ============================================================
#  Configuration de Jarvis
#  Modifie ce fichier librement, puis relance Jarvis.
# ============================================================

[general]
# Le prénom auquel Jarvis réagit (en minuscules).
mot_de_reveil = "jarvis"
# Autres façons dont la reconnaissance vocale peut mal écrire le prénom.
variantes_mot_de_reveil = ["jarvice", "jarviss", "jarvisse", "djarvis", "jarvi"]
# Comment Jarvis t'appelle.
nom_utilisateur = "Monsieur"
# Après une réponse, Jarvis continue d'écouter quelques secondes sans
# qu'il faille redire son prénom (pratique pour enchaîner une discussion).
secondes_de_suivi = 8
# Au-delà de ce délai sans échange, Jarvis oublie la conversation en cours.
minutes_avant_oubli = 10

[cerveau]
# Comment Jarvis accède à Claude :
#  - "abonnement" : via Claude Code installé sur ce PC, avec ton abonnement Claude
#                   (Pro / Max). Pas de clé API, rien à payer en plus, mais ça
#                   consomme tes quotas Claude Code et ajoute 2-5 s par réponse.
#  - "api"        : via une clé API (fichier .env), facturée à l'usage. Plus rapide.
fournisseur = "abonnement"
# Modèle Claude utilisé.
#  - "claude-opus-5-5"  : le plus intelligent (en mode "api" : ~1 à 2 centimes par commande)
#  - "claude-haiku-5-5" : bien plus rapide, consomme moins de quota (et ~40 fois
#                         moins cher en mode "api") ; suffisant pour des commandes
modele = "claude-opus-5-5"
# "low" = réponses rapides et économiques. "medium" ou "high" = plus réfléchi.
effort = "low"
# Autorise Jarvis à chercher sur internet (météo, actualités...).
# (En mode "api", coûte environ 1 centime par recherche.)
recherche_web = true

[voix]
# "edge"       : voix Microsoft gratuites (il faut internet).
# "elevenlabs" : voix ultra expressives (rires, chuchotements, enthousiasme...).
#                Compte gratuit sur https://elevenlabs.io (~10 000 caractères/mois),
#                puis colle ta clé dans le fichier .env (ELEVENLABS_API_KEY=...).
moteur = "edge"
# Voix Edge. Les plus naturelles : "fr-FR-VivienneMultilingualNeural" (femme),
# "fr-FR-RemyMultilingualNeural" (homme). Autres : "fr-FR-HenriNeural", "fr-FR-DeniseNeural"...
voix_edge = "fr-FR-VivienneMultilingualNeural"
# Vitesse ("+10%", "-5%"...) et hauteur ("+2Hz", "-3Hz"...) de la voix Edge.
vitesse = "+8%"
hauteur = "+2Hz"
# Varie la mélodie de la voix Edge phrase par phrase (plus haute et vive sur un « ! »,
# montante sur un « ? », plus lente sur un « … ») pour un ton plus vivant.
intonations = true

[voix.elevenlabs]
# Identifiant de la voix (bibliothèque de voix sur elevenlabs.io → « ID »).
# Par défaut « George », voix britannique chaleureuse très « Jarvis ».
voix = "JBFqnCBsd6RMkjVDRZzb"
# "eleven_v3" = le plus expressif (Jarvis y ajoute des émotions : [laughs], [whispers]...).
# "eleven_flash_v2_5" = plus rapide et consomme 2 fois moins de crédits, moins expressif.
modele = "eleven_v3"

[ecoute]
# Moteur de reconnaissance vocale :
#  - "whisper" : tourne sur ton PC, comprend beaucoup mieux (surtout les noms
#                propres), gratuit, mais utilise un peu ton processeur.
#  - "google"  : en ligne, plus léger, mais se trompe plus souvent.
moteur = "whisper"
# Taille du modèle Whisper : "base" (rapide), "small" (bon compromis),
# "medium" (le plus précis, mais nettement plus lent).
modele_whisper = "small"
# Comment Jarvis détecte qu'on l'appelle :
#  - "normal"     : tu dis juste « Jarvis, ... ».
#  - "hors_ligne" : tu dis « Hey Jarvis » ; détection ultra légère, pratique si
#                   Jarvis se déclenche quand tu parles à d'autres gens.
#                   (pip install openwakeword)
mode_reveil = "normal"
# Langue de la reconnaissance vocale.
langue = "fr-FR"
# Index du micro à utiliser (laisse -1 pour le micro par défaut).
# Lance `lancer_jarvis.bat --micros` pour voir la liste.
index_micro = -1
# Secondes de silence avant que Jarvis considère que tu as fini ta phrase.
# Augmente (2, 2.5...) s'il te coupe encore ; baisse (1.2) pour qu'il réponde plus vite.
pause_fin_de_phrase = 1.6
# Augmente (1.5, 2...) si Jarvis réagit aux bruits de fond ; baisse (0.7...)
# s'il ne t'entend pas bien ou coupe la fin de tes phrases.
sensibilite_micro = 1.0

[interface]
# Petite bulle en bas de l'écran qui montre ce que fait Jarvis :
# gris = en veille, bleu qui pulse = il t'écoute, orange = il réfléchit,
# violet = il agit, vert = il parle. (Déplaçable à la souris, clic droit pour quitter.)
bulle = true
# Petits bips quand Jarvis commence (bip montant) et arrête (bip descendant) de t'écouter.
sons = true

[discord]
# Comment Jarvis envoie les messages :
#  - "clavier" : il tape le message dans ton appli Discord, depuis TON compte, puis
#                te rend la main (environ 3 secondes où il utilise ton clavier).
#  - "bot"     : il passe par un bot Discord, 100 % en arrière-plan, mais le
#                message vient du bot, pas de ton compte. Voir le README.
methode = "clavier"
# Demande une confirmation vocale ("C'est bon ?") avant d'envoyer un message.
confirmer_avant_envoi = true
# Secondes d'attente pour que Discord s'ouvre / passe au premier plan.
delai_ouverture = 4

# Surnoms -> nom à taper dans la recherche Discord (Ctrl+K).
# Mets le pseudo Discord exact, ou le nom du serveur/salon.
[discord.contacts]
charles = "charles"
# maman = "maman_du_75"

# Pour la méthode "bot" uniquement : prénom -> identifiant Discord (un nombre).
# (Discord → Paramètres → Avancés → Mode développeur, puis clic droit sur la personne → Copier l'identifiant)
[discord.ids_bot]
# charles = "123456789012345678"

# Applications que Jarvis sait ouvrir : nom prononcé -> commande / lien.
# Sous Windows, un lien comme "discord://" ou "spotify:" lance l'appli installée.
# Tu peux aussi mettre un chemin complet vers un .exe entre guillemets.
[applications]
discord = "discord://"
spotify = "spotify:"
steam = "steam://open/main"
"bloc-notes" = "notepad"
calculatrice = "calc"
explorateur = "explorer"
paint = "mspaint"
chrome = "chrome"
"google chrome" = "chrome"
firefox = "firefox"
edge = "msedge"
"visual studio code" = "code"
vscode = "code"
word = "winword"
excel = "excel"
powerpoint = "powerpnt"
"gestionnaire des tâches" = "taskmgr"
"paramètres" = "ms-settings:"
# "league of legends" = 'C:\Riot Games\Riot Client\RiotClientServices.exe'

# Sites que Jarvis sait ouvrir par leur nom.
[sites]
youtube = "https://www.youtube.com"
gmail = "https://mail.google.com"
netflix = "https://www.netflix.com"
twitch = "https://www.twitch.tv"
chatgpt = "https://chatgpt.com"
"google maps" = "https://maps.google.com"
